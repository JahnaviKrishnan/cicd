<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Login</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"
  />
  <style>
    .amity-gradient {
      background: -webkit-linear-gradient(0deg, #ffb702, #0a4e95);
      background: linear-gradient(90deg, #ffb702, #0a4e95);
    }

    .amity-blue {
      color: #0a4e95;
    }

    .amity-gold {
      color: #ffb702;
    }

    .login-container {
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      background: white;
      overflow: hidden;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
    }

    .input-field {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px 16px;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: #0a4e95;
      box-shadow: 0 0 0 3px rgba(10, 78, 149, 0.1);
      outline: none;
    }

    .btn-login {
      background: -webkit-linear-gradient(0deg, #ffb702, #0a4e95);
      background: linear-gradient(90deg, #ffb702, #0a4e95);
      color: white;
      transition: all 0.3s ease;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(10, 78, 149, 0.2);
    }

    .login-header {
      position: relative;
    }

    .login-header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: -webkit-linear-gradient(0deg, #ffb702, #0a4e95);
      background: linear-gradient(90deg, #ffb702, #0a4e95);
    }

    .sample-notice {
      background-color: rgba(255, 183, 2, 0.1);
      border-left: 4px solid #ffb702;
      padding: 8px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #333;
    }

    @media (min-width: 768px) {
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
    }

    /* Header styling */
    .header-wrapper,
    .footer-wrapper {
      max-width: 900px;
      width: 100%;
      margin: 2rem auto 0 auto; /* default top margin */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .footer-wrapper {
      margin: 1.5rem auto 2rem auto; /* footer margin */
    }

    .header {
      background: linear-gradient(90deg, #ffb702 0%, #0a4e95 100%);
      display: flex;
      align-items: center; /* vertical center */
      padding: 1rem 1.5rem;
      gap: 1rem;
      color: white;
    }
    .header-logo {
      height: 50px;
      width: auto;
    }
    .header-text {
      font-family: "Constantia", serif;
      font-weight: 700;
      font-size: 1.5rem;
      user-select: none;
    }

    footer.amity-gradient {
      padding: 0.75rem 1rem;
      text-align: center;
      color: white;
      font-size: 0.75rem;
      font-weight: 500;
      background: linear-gradient(90deg,rgba(0, 0, 0, 0.347), #ffb702 0%, #0a4e95 100%);
    }

    body {
    
     background: linear-gradient(135deg, rgba(0, 0, 0, 0.347), #ffb702 0%, #0a4e95 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div class="header-wrapper">
    <header class="header">
      <img
        src="https://www.amity.edu/images/logo.png"
        alt="Amity University Bengaluru Logo"
        class="header-logo"
      />
      <div class="header-text">Amity University Bengaluru</div>
    </header>
  </div>

  <main class="login-container p-8 bg-white">
    <div class="sample-notice">
      <strong>Notice:</strong> Please ensure all fields are filled out correctly. If
      you encounter any issues, contact the support team.
    </div>

    <h2 class="login-header text-xl font-bold text-center text-gray-800 mb-8 pb-2">Student Sign In</h2>

    <form id="loginForm" class="space-y-6">
      <div class="form-grid">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="input-field w-full"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div>
          <label for="enrollment_number" class="block text-sm font-medium text-gray-700 mb-1">Enrollment Number</label>
          <input
            type="text"
            id="enrollment_number",
            name="enrollment_number",
            class="input-field w-full"
            placeholder="Enter your enrollment number"
            required
          />
        </div>

        <div>
          <label for="specialization" class="block text-sm font-medium text-gray-700 mb-1">Specialization</label>
          <select id="specialization" name="specialization" class="input-field w-full" required>
            <option value="" disabled selected>Select your specialization</option>
            <option value="cse_core">Computer Science and Engineering</option>
            <option value="aiml">Artificial Intelligence and Machine Learning</option>
            <option value="robotics">Robotics</option>
            <option value="cyber_security">Cyber Security</option>
            <option value="cloud_computing">Cloud computing</option>
            <option value="iot">iot</option>
            <option value="data_analytics">Data Analytics</option>
            <option value="big_data">Big data</option>
            <option value="devops">Devops</option>
            <option value="Biotechnology">Bio Technology</option>
          </select>
        </div>

        <div>
          <label for="Batch" class="block text-sm font-medium text-gray-700 mb-1">Batch</label>
          <select id="Batch" name="Batch" class="input-field w-full" required>
            <option value="" disabled selected>Select your batch</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
            <option value="B3">B3</option>
            <option value="B4">B4</option>
            <option value="B5">B5</option>
            <option value="B6">B6</option>
            <option value="B7">B7</option>
            <option value="B8">B8</option>
            <option value="B9">B9</option>
            <option value="B10">B10</option>
            <option value="B11">B11</option>
          </select>
        </div>

        <div>
          <label for="cgpa" class="block text-sm font-medium text-gray-700 mb-1">CGPA</label>
          <input
            type="number"
            id="cgpa"
            name="cgpa"
            min="0"
            max="10"
            step="0.01"
            class="input-field w-full"
            placeholder="Enter your current CGPA"
            required
          />
        </div>
      </div>

      <div class="mt-6">
        <button
          type="submit"
          
          class="btn-login w-full py-3 px-4 rounded-md font-medium focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0A4E95]"
        >
        <!-- <a href="finalui.html">
          Sign In
      </a> -->
        </button>
      </div>
    </form>

    <div class="mt-6 text-center">
      <p class="text-sm text-gray-600">
        Need help? <a href="#" class="font-medium amity-blue hover:text-[#FFB702]">Contact Support</a>
      </p>
    </div>
  </main>

  <div class="footer-wrapper">
    <footer class="amity-gradient">
      <p> 2023 Amity University. All rights reserved.</p>
    </footer>
  </div>

 <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const name = document.getElementById("name").value;
        const enrollment_number = document.getElementById("enrollment_number").value;
        const specialization = document.getElementById("specialization").value;
        const Batch = document.getElementById("Batch").value;
        const cgpa = parseFloat(document.getElementById("cgpa").value);
    
        if (!name || !enrollment_number || !specialization || !Batch || isNaN(cgpa)) {
            alert("Please fill in all required fields");
            return;
        }
    
        if (cgpa < 0 || cgpa > 10) {
            alert("CGPA must be between 0 and 10");
            return;
        }
    
        try {
            const response = await fetch("http://localhost:3000/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    name,
                    enrollment_number,
                    Batch,
                    specialization,
                    cgpa
                }),
            });
    
            const data = await response.json();
            console.log("Login Result:", data);
    
            if (!response.ok) {
                throw new Error(data.message || "Login failed");
            }
    
            // Store user data in localStorage
            if (data.student) {
                localStorage.setItem("studentData", JSON.stringify(data.student));
                window.location.href = "finalui.html";
            } else {
                alert(data.error || "Login failed");
            }
        } catch (error) {
            console.error("Login Error:", error);
            alert("Login request failed: " + error.message);
        }
    });
</script>

</body>
</html>
